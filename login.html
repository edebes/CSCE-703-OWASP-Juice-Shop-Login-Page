<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f47b20">
    <title>Login | OWASP Juice Shop</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #333;
            background: rgb(31, 31, 31);
            font-synthesis: none;
            text-rendering: optimizeLegibility;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
        }

        .toolbar {
            display: flex;
            align-items: center;
            min-height: 64px;
            padding: 0 24px;
            background: rgb(48, 68, 80);
            box-shadow: 0 2px 5px rgb(0 0 0 / 22%);
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            font-size: 20px;
            font-weight: 500;
            letter-spacing: 0.15px;
            text-decoration: none;
        }

        main {
            display: grid;
            place-items: start center;
            min-height: calc(100vh - 64px);
            padding: 56px 20px;
        }

        .login-card {
            width: min(100%, 440px);
            padding: 28px 32px 24px;
            background: #fff;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgb(0 0 0 / 18%);
        }

        h1 {
            margin: 0 0 26px;
            font-size: 24px;
            font-weight: 400;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #555;
            font-size: 14px;
        }

        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            min-height: 42px;
            padding: 9px 11px;
            border: 1px solid #bdbdbd;
            border-radius: 3px;
            color: #333;
            font: inherit;
            outline: none;
        }

        .password-wrap {
            position: relative;
        }

        .password-wrap input {
            padding-right: 76px;
        }

        .show-password {
            position: absolute;
            top: 50%;
            right: 8px;
            padding: 6px;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            color: #555;
            cursor: pointer;
            font: inherit;
            font-size: 13px;
        }

        .show-password:hover {
            color: Gray;
        }

        .login-button {
            width: 100%;
            min-height: 42px;
            border: 0;
            border-radius: 3px;
            background: rgb(48, 68, 80);
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }

        .login-button:hover {
            background: rgb(27, 47, 55);
        }

        .login-button:focus-visible,
        .show-password:focus-visible {
            outline: 2px solid Gray;
            outline-offset: 3px;
        }

        .message {
            min-height: 20px;
            margin: 14px 0 0;
            color: #555;
            font-size: 13px;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            .toolbar {
                min-height: 56px;
                padding: 0 16px;
            }

            main {
                min-height: calc(100vh - 56px);
                padding: 32px 14px;
            }

            .login-card {
                padding: 24px 20px 20px;
            }
        }
    </style>
    <script src="login.js" defer></script>
</head>

<body>
    <header class="toolbar">
        <a class="brand" href="login.html" aria-label="OWASP Juice Shop home">
            <span>OWASP Juice Shop</span>
        </a>
    </header>

    <main>
        <section class="login-card" aria-labelledby="login-title">
            <h1 id="login-title">Login</h1>
            <form id="login-form" novalidate>
                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" autocomplete="username" placeholder="Email*">
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <div class="password-wrap">
                        <input id="password" name="password" type="password" autocomplete="current-password"
                            placeholder="Password*">
                        <button class="show-password" id="toggle-password" type="button" aria-controls="password"
                            aria-pressed="false">Show</button>
                    </div>
                </div>

                <button class="login-button" type="submit">Log in</button>
                <p class="message" id="form-message" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>
</body>

</html>
